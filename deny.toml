[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]
all-features = true

[advisories]
ignore = [
  # proc-macro-error is pulled by a non-runtime transitive build macro. The
  # notice is unmaintained status rather than a memory-safety vulnerability.
  { id = "RUSTSEC-2024-0436", reason = "transitive build macro maintenance notice" },
  # syntect 5.3 still uses the completed bincode 1.x line and yaml-rust. These
  # are maintenance notices with no safe upgrade path in syntect today; keep
  # the exceptions narrow so new vulnerability advisories continue to fail.
  { id = "RUSTSEC-2025-0141", reason = "transitive syntect maintenance notice with no safe upgrade" },
  { id = "RUSTSEC-2024-0320", reason = "transitive syntect maintenance notice with no safe upgrade" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
# Internal path dependencies do not carry registry-style semver requirements;
# the lock and provenance gates pin them instead.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
