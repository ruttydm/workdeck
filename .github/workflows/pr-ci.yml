name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: cargo xtask ci-changes "$BASE_SHA" "$HEAD_SHA"

  changeset-status:
    name: Release-note changeset
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release-note changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: cargo xtask release verify-pr-notes "$BASE_SHA" "$HEAD_SHA"

  windows-compat:
    name: Windows compatibility
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format check
        run: cargo fmt --all --check
      - name: Test native workspace
        run: cargo test --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  compiled-headless-portability:
    name: Compiled headless portability (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build sole executable
        run: cargo build --locked --release --target ${{ matrix.target }} --package workdeck-cli --bin workdeck
      - name: Verify headless commands and runtime boundary
        run: cargo test --locked -p workdeck-cli --test cli --test terminal_lifecycle

  pr-validate:
    name: Native validation and smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4
      - name: Fetch pinned evidence
        run: cargo xtask port fetch
      - name: Validate native source and architecture
        run: cargo xtask verify
      - name: Check static website
        run: cargo xtask site check
      - name: Test terminal workspace
        run: cargo xtask test
      - name: Format, lint, and build
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo build --locked --release --package workdeck-cli --bin workdeck
      - name: Smoke test the sole executable
        run: target/release/workdeck --help
