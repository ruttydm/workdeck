name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  nix:
    name: Nix package and install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Evaluate, build, and run the Nix package
        run: cargo xtask nix check

  tui:
    name: TUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify native compiler host
        run: cargo xtask ci-host ${{ matrix.target }}

      - name: Format
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check

      - name: Validate Hunk ledger structure
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo xtask port fetch
          cargo xtask port audit --allow-incomplete

      - name: Install Zola
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Check Rust-driven static site
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask site check

      - name: Generate dependency license inventory
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask licenses

      - name: Test terminal workspace
        run: cargo test --locked --workspace --all-targets

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Release build
        run: cargo build --locked --release --package workdeck-cli --bin workdeck
