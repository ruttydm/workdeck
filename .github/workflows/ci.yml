name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: cargo xtask ci-changes "$BASE_SHA" "$HEAD_SHA"

  nix:
    name: Nix package and install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Evaluate, build, and run the Nix package
        run: cargo xtask nix check

  tui:
    name: TUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify native compiler host
        run: cargo xtask ci-host ${{ matrix.target }}

      - name: Format
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check

      - name: Fetch pinned upstream evidence for native tests
        run: cargo xtask port fetch

      - name: Validate Hunk ledger structure
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask port audit

      - name: Install Zola
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4

      - name: Check Rust-driven static site
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask site check

      - name: Generate dependency license inventory
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask licenses

      - name: Test terminal workspace
        run: cargo xtask test

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Release build
        run: cargo build --locked --release --package workdeck-cli --bin workdeck

  validate:
    name: Native validation and parity
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4
      - name: Fetch pinned Hunk evidence
        run: cargo xtask port fetch
      - name: Validate ledger structure
        run: cargo xtask port audit
      - name: Formatting
        run: cargo fmt --all --check
      - name: Workspace tests
        run: cargo test --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native architecture and source gates
        run: cargo xtask verify
      - name: Static website check
        run: cargo xtask site check
      - name: Dependency license inventory
        run: cargo xtask licenses

  tty-smoke:
    name: Terminal smoke tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Exercise terminal lifecycle and pager
        run: cargo test --locked -p workdeck-cli --test terminal_lifecycle --test terminal_pager

  package:
    name: Native package smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build the sole executable
        run: cargo build --locked --release --package workdeck-cli --bin workdeck
      - name: Verify executable and package ownership
        run: |
          target/release/workdeck --help
          target/release/workdeck --version
          cargo xtask architecture check
      - name: Generate dependency license inventory
        run: cargo xtask licenses --output dist/licenses.json
