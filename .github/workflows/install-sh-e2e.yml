# Native archive installation checks replace the historical POSIX installer E2E.
name: Install archive E2E

on:
  pull_request:
    paths:
      - crates/workdeck-cli/src/install/**
      - .github/workflows/install-sh-e2e.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-e2e:
    name: Native installation E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Exercise native installation transactions
        run: cargo test --locked -p workdeck-cli install::
      - name: Exercise installer and archive oracles
        run: cargo test --locked -p xtask install_oracle
      - name: Verify read-only installation plan
        run: cargo xtask install-plan --no-modify-path
      - name: Verify the sole executable
        run: |
          cargo build --locked --release --package workdeck-cli --bin workdeck
          target/release/workdeck --version
