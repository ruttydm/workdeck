name: Nix

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: cargo xtask ci-changes "$BASE_SHA" "$HEAD_SHA"

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Check flake outputs
        run: nix flake check --no-write-lock-file --print-build-logs
      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build
      - name: Build Workdeck package
        run: nix build .#default --print-build-logs
      - name: Smoke test Nix package
        run: |
          ./result/bin/workdeck --help
          skill_path="$(./result/bin/workdeck skill path)"
          test -f "$skill_path"
