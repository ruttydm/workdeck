[package]
name = "workdeck-vcs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Version-control adapters for Workdeck reviews"

[dependencies]
notify = "8.2"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
workdeck-core = { path = "../workdeck-core" }
workdeck-diff = { path = "../workdeck-diff" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[dev-dependencies]
tempfile = "3.13"
