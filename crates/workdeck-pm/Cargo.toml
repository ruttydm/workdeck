[package]
name = "workdeck-pm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Git-native project management contracts and operations for Workdeck"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
quick-xml = "0.41"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "serialize", "hooks", "limits", "cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
schemars = { version = "1.2", features = ["chrono04"] }
sha2 = "0.10"
thiserror = "2.0"
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.22"
ulid = { version = "1.2", features = ["serde"] }
yaml-edit = "0.3.1"

[dev-dependencies]
tempfile = "3.13"
