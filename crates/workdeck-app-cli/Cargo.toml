[package]
name = "workdeck-app-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Automation interface for the Workdeck desktop catalog"

[lib]
name = "workdeck_app_cli"
path = "src/lib.rs"

[[bin]]
name = "workdeck-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
workdeck-api = { path = "../workdeck-api" }
workdeck-artifacts = { path = "../workdeck-artifacts" }
workdeck-core = { path = "../workdeck-core" }
workdeck-domain = { path = "../workdeck-domain" }
workdeck-git = { path = "../workdeck-git" }
workdeck-github = { path = "../workdeck-github" }
workdeck-presenter = { path = "../workdeck-presenter" }
chrono.workspace = true
clap = { version = "4.5", features = ["derive"] }
futures.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile.workspace = true
