[package]
name = "workdeck-markup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal-safe STML parser and renderer for Workdeck notes"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
serde_json = "1.0"
