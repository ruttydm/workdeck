[package]
name = "workdeck-extension-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned native extension protocol for Workdeck"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
