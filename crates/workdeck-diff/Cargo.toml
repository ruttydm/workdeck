[package]
name = "workdeck-diff"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Patch parsing and terminal row geometry for Workdeck"

[dependencies]
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
syntect = "5.2"
thiserror = "2.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"
workdeck-core = { path = "../workdeck-core" }

[build-dependencies]
syntect = "5.2"
