[package]
name = "workdeck-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal-native sidecar for agentic coding"
readme = "README.md"
keywords = ["tui", "git", "terminal", "tasks", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "workdeck"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["use-dev-tty"] }
fuzzy-matcher = "0.3"
git2 = "0.21"
ignore = "0.4"
indexmap = { version = "2.14", features = ["serde"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
syntect = "5.2"
thiserror = "2.0"
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.22"
workdeck-core = { path = "../workdeck-core" }
workdeck-diff = { path = "../workdeck-diff" }
workdeck-extension-api = { path = "../workdeck-extension-api" }
workdeck-extension-host = { path = "../workdeck-extension-host" }
workdeck-migration = { path = "../workdeck-migration" }
workdeck-markup = { path = "../workdeck-markup" }
workdeck-review = { path = "../workdeck-review" }
workdeck-session = { path = "../workdeck-session" }
workdeck-store = { path = "../workdeck-store" }
workdeck-tui = { path = "../workdeck-tui" }
workdeck-vcs = { path = "../workdeck-vcs" }

[dev-dependencies]
base64 = "0.22"
ureq = { version = "3.4", default-features = false }
sha2 = "0.10"
unicode-width = "0.2"
assert_cmd = "2.0"
predicates = "3.1"
qwertty-term-vt = "0.4.0"
tempfile = "3.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
