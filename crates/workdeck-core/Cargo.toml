[package]
name = "workdeck-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Renderer-neutral review models for Workdeck"

[dependencies]
indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"

[target.'cfg(target_arch = "aarch64")'.dependencies]
# sha2 0.10 gates its runtime-detected ARM SHA-2 backend behind this feature.
# Digest inputs/outputs stay identical; CPUs without support retain the soft fallback.
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
tempfile = "3.13"
