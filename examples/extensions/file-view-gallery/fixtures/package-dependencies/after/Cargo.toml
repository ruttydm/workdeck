[package]
name = "review-console"
version = "1.9.0"
edition = "2021"
publish = false
keywords = ["diff", "review", "terminal"]

[package.metadata.commands]
build = "cargo build"
check = "cargo fmt --check && cargo test"
dev = "cargo run"
minimum-rust = "1.85"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
clap = "4.5.48"
serde = "1.0.228"
thiserror = "2.0.17"

[dev-dependencies]
insta = "1.43.2"
proptest = "1.8.0"
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
toml = "0.9.8"
