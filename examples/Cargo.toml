[package]
name = "workdeck-examples"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "workdeck-example-cli-tools-extension"
path = "extensions/cli-tools/main.rs"

[[bin]]
name = "workdeck-example-pane-layout-extension"
path = "extensions/pane-layout/main.rs"

[[bin]]
name = "workdeck-example-vim-navigation-extension"
path = "extensions/vim-navigation/main.rs"

[[bin]]
name = "workdeck-example-review-snapshot-export-extension"
path = "extensions/review-snapshot-export/main.rs"

[[bin]]
name = "workdeck-example-review-note-navigator-extension"
path = "extensions/review-note-navigator/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
workdeck-core = { path = "../crates/workdeck-core" }
workdeck-extension-api = { path = "../crates/workdeck-extension-api" }
workdeck-tui = { path = "../crates/workdeck-tui" }

[dev-dependencies]
crossterm = "0.28"
workdeck-diff = { path = "../crates/workdeck-diff" }
workdeck-markup = { path = "../crates/workdeck-markup" }
workdeck-extension-host = { path = "../crates/workdeck-extension-host" }
workdeck-review = { path = "../crates/workdeck-review" }
tempfile = "3.13"
