[package]
name = "workdeck-examples"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "workdeck-example-cli-tools-extension"
path = "extensions/cli-tools/main.rs"

[[bin]]
name = "workdeck-example-pane-layout-extension"
path = "extensions/pane-layout/main.rs"

[[bin]]
name = "workdeck-example-vim-navigation-extension"
path = "extensions/vim-navigation/main.rs"

[[bin]]
name = "workdeck-example-keyboard-probe-extension"
path = "extensions/keyboard-probe/main.rs"

[[bin]]
name = "workdeck-example-key-routing-probe-extension"
path = "extensions/key-routing-probe/main.rs"

[[bin]]
name = "workdeck-example-keybindings-probe-extension"
path = "extensions/keybindings-probe/main.rs"

[[bin]]
name = "workdeck-example-app-host-file-views-probe-extension"
path = "extensions/app-host-file-views-probe/main.rs"

[[bin]]
name = "workdeck-example-app-host-file-view-modes-probe-extension"
path = "extensions/app-host-file-view-modes-probe/main.rs"

[[bin]]
name = "workdeck-example-app-host-extension-dialogs-probe-extension"
path = "extensions/app-host-extension-dialogs-probe/main.rs"

[[bin]]
name = "workdeck-example-review-snapshot-export-extension"
path = "extensions/review-snapshot-export/main.rs"

[[bin]]
name = "workdeck-example-review-note-navigator-extension"
path = "extensions/review-note-navigator/main.rs"

[[bin]]
name = "workdeck-example-rendered-markdown-extension"
path = "extensions/rendered-markdown/main.rs"

[[bin]]
name = "workdeck-example-jsx-file-view-extension"
path = "extensions/jsx-file-view/main.rs"

[[bin]]
name = "workdeck-example-inline-edit-extension"
path = "extensions/inline-edit/main.rs"

[[bin]]
name = "workdeck-example-review-triage-extension"
path = "extensions/review-triage/main.rs"

[[bin]]
name = "workdeck-example-github-pr-extension"
path = "extensions/github-pr/main.rs"

[[bin]]
name = "workdeck-example-file-view-gallery-extension"
path = "extensions/file-view-gallery/main.rs"

[[bin]]
name = "workdeck-example-file-view-gallery-mixed-review"
path = "extensions/file-view-gallery/mixed-review/run.rs"

[[bin]]
name = "workdeck-example-native-vcs-extension"
path = "extensions/native-vcs/main.rs"

[[bin]]
name = "workdeck-example-startup-lifecycle-extension"
path = "extensions/startup-lifecycle/main.rs"

[[bin]]
name = "workdeck-example-line-highlighter-extension"
path = "extensions/line-highlighter/main.rs"

[dependencies]
pulldown-cmark = "=0.13.4"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
toml = "0.8"
unicode-segmentation = "1.12"
unicode-width = "0.2"
ureq = "3.4"
url = "2.5"
workdeck-core = { path = "../crates/workdeck-core" }
workdeck-extension-api = { path = "../crates/workdeck-extension-api" }
workdeck-tui = { path = "../crates/workdeck-tui" }

[dev-dependencies]
crossterm = "0.28"
workdeck-diff = { path = "../crates/workdeck-diff" }
workdeck-markup = { path = "../crates/workdeck-markup" }
workdeck-extension-host = { path = "../crates/workdeck-extension-host" }
workdeck-review = { path = "../crates/workdeck-review" }
workdeck-vcs = { path = "../crates/workdeck-vcs" }
