[workspace]
members = [
  "crates/workdeck-cli",
  "crates/workdeck-app-cli",
  "crates/workdeck-desktop",
  "crates/workdeck-ui",
  "crates/workdeck-api",
  "crates/workdeck-presenter",
  "crates/workdeck-core",
  "crates/workdeck-domain",
  "crates/workdeck-db",
  "crates/workdeck-git",
  "crates/workdeck-analysis",
  "crates/workdeck-github",
  "crates/workdeck-artifacts",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ruttydm/workdeck"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2.5"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
dioxus = { version = "=0.7.1", default-features = false, features = [
  "asset",
  "document",
  "hooks",
  "html",
  "macro",
  "signals",
] }
dioxus-desktop = { version = "=0.7.10", default-features = false, features = [
  "devtools",
  "tokio_runtime",
  "transparent",
] }
dioxus-free-icons = { version = "=0.10.0", default-features = false, features = ["lucide"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955" }
dioxus-ssr = "=0.7.3"
dioxus-web = { version = "=0.7.3", default-features = false, features = ["document", "mounted"] }
futures = "0.3"
futures-timer = "3.0"
git2 = "0.21"
manganis = "=0.7.10"
mime_guess = "2.0"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSWindow"] }
percent-encoding = "2.3"
pulldown-cmark = "0.13"
rfd = "=0.17.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tempfile = "3.13"
thiserror = "2.0"
tiny_http = "0.12"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.23"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7.3"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.18", features = ["js", "serde", "v7"] }
web-sys = { version = "0.3", features = ["Document", "Element", "Location", "Window"] }
web-time = "=1.1.0"
zip = { version = "6.0", default-features = false, features = ["deflate"] }
