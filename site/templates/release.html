{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ config.title }}{% endblock title %}
{% block metadata %}
    <meta name="description" content="{{ page.description }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ page.extra.social_image }}">
    <meta property="og:image:alt" content="{{ page.extra.social_image_alt }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ page.extra.social_image }}">
{% endblock metadata %}
{% block content %}
<article class="release-notes">
  <h1>{{ page.title }}</h1>
  {{ page.content | safe }}
</article>
{% endblock content %}
