[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
libc = "0.2"
cargo_metadata = "0.19"
chrono = "0.4"
crossterm = { version = "0.28", features = ["use-dev-tty"] }
flate2 = "1.1"
png = "0.18"
portable-pty = "0.9"
qwertty-term-vt = "0.4.0"
regex = "1.11"
ryu-js = "1.0.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
rnix = "0.14"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
serde_norway = "0.9.42"
sha2 = "0.10"
swash = "0.2.10"
syn = { version = "2.0", features = ["full", "parsing"] }
tar = "0.4"
tempfile = "3.13"
toml_edit = "0.22"
url = "2.5"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
workdeck-session = { path = "../crates/workdeck-session" }
workdeck-core = { path = "../crates/workdeck-core" }
workdeck-vcs = { path = "../crates/workdeck-vcs" }
workdeck-diff = { path = "../crates/workdeck-diff" }
workdeck-tui = { path = "../crates/workdeck-tui" }
workdeck-review = { path = "../crates/workdeck-review" }
