[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
cargo_metadata = "0.19"
flate2 = "1.1"
png = "0.18"
portable-pty = "0.9"
qwertty-term-vt = "0.4.0"
regex = "1.11"
rnix = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9.42"
sha2 = "0.10"
swash = "0.2.10"
syn = { version = "2.0", features = ["full", "parsing"] }
tar = "0.4"
tempfile = "3.13"
url = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
workdeck-session = { path = "../crates/workdeck-session" }
