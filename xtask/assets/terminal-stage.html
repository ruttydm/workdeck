<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Fixed 1920x1080 Workdeck terminal-video stage. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("__WORKDECK_FONT_URL__") format("truetype");
      }
      body {
        font-family: "JetBrains Mono", monospace;
        background:
          radial-gradient(1200px 800px at 18% -10%, #232f55 0%, rgba(35, 47, 85, 0) 60%),
          radial-gradient(1000px 700px at 105% 110%, #3b2140 0%, rgba(59, 33, 64, 0) 55%),
          linear-gradient(160deg, #0c101c 0%, #080b13 100%);
        color: #e6ecff;
        position: relative;
      }

      /* ---- terminal window ---- */
      #stage-term {
        position: absolute;
        left: 50%;
        top: 44px;
        width: 1560px;
        transform: translateX(-50%);
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 34px 90px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.07);
        background: #10141f;
      }
      #term-bar {
        height: 46px;
        display: flex;
        align-items: center;
        background: linear-gradient(#1d2331, #171c28);
        position: relative;
      }
      #term-bar .lights {
        display: flex;
        gap: 9px;
        padding-left: 18px;
      }
      #term-bar .lights i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: block;
      }
      #term-bar .lights i:nth-child(1) {
        background: #ff5f57;
      }
      #term-bar .lights i:nth-child(2) {
        background: #febc2e;
      }
      #term-bar .lights i:nth-child(3) {
        background: #28c840;
      }
      #term-title {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 19px;
        color: #8b93ad;
        letter-spacing: 0.02em;
      }
      #term-content {
        width: 1560px;
        height: 892px;
        position: relative;
      }
      #term-img {
        position: absolute;
        inset: 0;
        width: 100%;
        display: block;
      }

      /* ---- caption band ---- */
      #caption {
        position: absolute;
        left: 0;
        right: 0;
        top: 992px;
        text-align: center;
      }
      #caption .line {
        display: inline-block;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
      }
      #caption .badge {
        display: inline-block;
        font-size: 26px;
        font-weight: 700;
        padding: 6px 16px;
        margin-right: 16px;
        border-radius: 999px;
        background: #e0af68;
        color: #171003;
        letter-spacing: 0.06em;
        vertical-align: 4px;
      }
      #caption .hl {
        color: #e0af68;
      }
      #caption .dim {
        color: #9aa3bd;
        font-weight: 500;
      }

      /* ---- full-screen cards ---- */
      #card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        text-align: center;
      }
      #card .badge {
        font-size: 30px;
        font-weight: 700;
        padding: 8px 26px;
        border-radius: 999px;
        background: #e0af68;
        color: #171003;
        letter-spacing: 0.12em;
      }
      #card h1 {
        font-size: 190px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        background: linear-gradient(120deg, #f2f6ff 30%, #aab8e8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #card h2 {
        font-size: 74px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #card .sub {
        font-size: 42px;
        color: #9aa3bd;
        font-weight: 500;
      }
      #card .sub .hl {
        color: #e0af68;
      }
      #card .cmds {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 14px;
      }
      #card .cmd {
        font-size: 44px;
        font-weight: 600;
        padding: 18px 42px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.055);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      #card .cmd .p {
        color: #bb9af7;
      }
      #card .foot {
        font-size: 28px;
        color: #6c7590;
        margin-top: 26px;
      }
    </style>
  </head>
  <body>
    <div id="stage-term" style="display: __WORKDECK_TERM_DISPLAY__; opacity: __WORKDECK_SHOT_OPACITY__; transform: translateX(-50%) scale(__WORKDECK_TERM_SCALE__)">
      <div id="term-bar">
        <div class="lights"><i></i><i></i><i></i></div>
        <div id="term-title">__WORKDECK_TERM_TITLE__</div>
      </div>
      <div id="term-content" style="background: __WORKDECK_TERM_BACKGROUND__"><img id="term-img" alt="" src="__WORKDECK_TERM_IMAGE__" /></div>
    </div>
    <div id="caption" style="opacity: __WORKDECK_CAPTION_OPACITY__; transform: translateY(__WORKDECK_CAPTION_Y__px)">__WORKDECK_CAPTION__</div>
    <div id="card" style="display: __WORKDECK_CARD_DISPLAY__; opacity: __WORKDECK_SHOT_OPACITY__; transform: scale(__WORKDECK_CARD_SCALE__)">__WORKDECK_CARD__</div>
  </body>
</html>
